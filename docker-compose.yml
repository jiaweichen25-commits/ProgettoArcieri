services:
  db:
    build: ./Arcieri_database
    container_name: arcieri_db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-troia}
      POSTGRES_DB: ${DB_NAME:-ProgettoArcieri}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - arcieri_network

  backend:
    build: ./backend
    container_name: arcieri_backend
    restart: always
    # Nessun "ports": il backend e' raggiungibile solo dagli altri container
    # (nginx lo chiama su backend:8000). Dal browser si passa da nginx, su /api.
    # Per Swagger in sviluppo vedi docker-compose.override.yml.example.
    environment:
      - DATABASE_URL=postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-troia}@db:5432/${DB_NAME:-ProgettoArcieri}
      - SECRET_KEY=${SECRET_KEY:?imposta SECRET_KEY nel file .env}
      - SMTP_SERVER=${SMTP_SERVER:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - OPENROUTER_MODEL_ANALISI=${OPENROUTER_MODEL_ANALISI:-qwen/qwen3-32b}
      - OPENROUTER_MODEL_RAGIONAMENTO=${OPENROUTER_MODEL_RAGIONAMENTO:-deepseek/deepseek-chat-v3-0324}
      - OPENROUTER_MODEL_DEFAULT=${OPENROUTER_MODEL_DEFAULT:-meta-llama/llama-3.3-70b-instruct}
      - GROQ_MODEL=${GROQ_MODEL:-llama-3.3-70b-versatile}
      - LLM_PROVIDER_ORDER=${LLM_PROVIDER_ORDER:-openrouter,groq,gemini}
      - CORS_ORIGINS=${CORS_ORIGINS:-}
      - DEFAULT_ADMIN_PASSWORD=${DEFAULT_ADMIN_PASSWORD:-}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - arcieri_network

  frontend:
    build: ./frontend
    container_name: arcieri_frontend
    restart: always
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - arcieri_network


volumes:
  postgres_data:
    driver: local

networks:
  arcieri_network:
    driver: bridge