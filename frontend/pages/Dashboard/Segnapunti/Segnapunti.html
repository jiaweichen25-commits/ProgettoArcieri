<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="../../../assets/Favicon.svg">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Arcieri Vicenza – Segnapunti</title>
  <link rel="stylesheet" href="../Materiali/Materiali.css" />
  <style>
    /* Manteniamo i tuoi stili custom per la griglia dei punteggi */
    .score-grid {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.78rem;
      margin-bottom: 24px;
    }
    .score-grid th {
      background: #1a1a1a;
      color: #c0392b;
      padding: 5px 6px;
      text-align: center;
      border: 1px solid #333;
      font-size: 0.65rem;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    .score-grid td {
      border: 1px solid #2a2a2a;
      padding: 4px 5px;
      text-align: center;
      background: #111;
    }
    .score-grid td.num { color: #888; font-size: 0.7rem; }
    .score-grid td.somma { font-weight: 700; color: #eee; }
    .score-grid td.totale { font-weight: 700; color: #c0392b; }
    .score-grid td.contatori { color: #aaa; font-size: 0.7rem; }
    .score-grid input.freccia {
      width: 30px;
      background: #1a1a1a;
      border: 1px solid #333;
      color: white;
      text-align: center;
      padding: 3px;
      border-radius: 2px;
      font-size: 0.78rem;
      text-transform: uppercase;
    }
    .score-grid input.freccia:focus {
      outline: none;
      border-color: #c0392b;
    }
    .score-grid tr.mezza-header td {
      background: #1a1a1a;
      color: #888;
      font-size: 0.72rem;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      padding: 4px 8px;
    }
    .score-grid tr.totale-row td {
      background: #1a1a1a;
      font-weight: 700;
      border-top: 2px solid #c0392b;
    }
    .totale-finale {
      text-align: right;
      font-size: 1.4rem;
      font-weight: 700;
      color: #c0392b;
      margin-bottom: 24px;
    }
    .mezza-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }
    .mezza-tab {
      padding: 8px 20px;
      border: 1px solid #333;
      background: #111;
      color: #aaa;
      cursor: pointer;
      border-radius: 2px;
      font-size: 0.85rem;
      letter-spacing: 1px;
    }
    .mezza-tab.active {
      border-color: #c0392b;
      color: white;
      background: rgba(192,57,43,0.12);
    }
  </style>
</head>
<body>

<nav>
  <div class="brand">
    <div class="brand-accent"></div>
    <div class="brand-text">
      <span>Segnapunti</span>
      <strong id="titoloAtletaNav">—</strong>
    </div>
  </div>
  <div class="nav-right">
    <button class="btn-logout" onclick="tornaDashboard()">← Dashboard</button>
  </div>
</nav>
<div class="page">
  <div class="page-header">
    <div class="pill">Area Istruttore</div>
    <h1 id="titoloAtleta">Segnapunti</h1>
    <p>Sessioni di tiro dell'atleta</p>
  </div>

  <div class="msg-box" id="pageMsgBox"></div>

  <div class="section" id="listaSezione">
    <div class="section-head">
      <div class="section-title">Storico Sessioni</div>
    </div>
    <div id="segnapuntiList"></div>
    <div id="emptyState" class="empty-state" style="display:none;">
      Nessuna sessione registrata per questo atleta.
    </div>
  </div>

  <div class="section" id="scoreSezione" style="display:none;">
    <div class="section-head">
      <div class="section-title" id="scoreTitolo">Sessione</div>
      <button class="btn btn-outline" onclick="chiudiScore()">← Lista sessioni</button>
    </div>

    <div class="mezza-tabs">
      <button class="mezza-tab active" id="tab1" onclick="switchMezza(1)">Turno 1</button>
      <button class="mezza-tab" id="tab2" onclick="switchMezza(2)">Turno 2</button>
    </div>

    <table class="score-grid" id="scoreTable">
      <thead>
        <tr>
          <th>N°</th>
          <th>1</th>
          <th>2</th>
          <th>3</th>
          <th id="thF4" style="display:none;">4</th>
          <th id="thF5" style="display:none;">5</th>
          <th id="thF6" style="display:none;">6</th>
          <th>Somma</th>
          <th>Tot.</th>
          <th>10</th>
          <th>X</th>
        </tr>
      </thead>
      <tbody id="scoreBody"></tbody>
    </table>

    <div class="totale-finale" id="totaleFinalBox" style="display:none;"></div>

    <div class="msg-box" id="scoreMsgBox"></div>

    <div style="display:flex; gap:16px; margin-top:24px; flex-wrap:wrap;">
      <div class="field" style="flex:1; min-width:200px;">
        <label>Note Istruttore</label>
        <textarea id="noteIstruttore" rows="3" style="width:100%;background:#111;border:1px solid #333;color:white;padding:10px;border-radius:2px;font-family:inherit;resize:vertical;"></textarea>
      </div>
      <div class="field" style="flex:1; min-width:200px;">
        <label>Note Atleta (sola lettura)</label>
        <textarea id="noteAtleta" rows="3" style="width:100%;background:#111;border:1px solid #333;color:white;padding:10px;border-radius:2px;font-family:inherit;resize:vertical;" readonly></textarea>
      </div>
    </div>
    <div style="display:flex; justify-content:flex-end; margin-top:8px;">
      <button class="btn btn-red" onclick="salvaNoteIstruttore()">Salva Note Istruttore</button>
    </div>

    <div class="section-title" style="margin-top: 32px; margin-bottom: 12px;">Bersaglio Interattivo</div>
<iframe id="bersaglioFrame" src="Bersaglio.html" title="Bersaglio interattivo" style="width:100%; max-width:460px; height:640px; border:none; border-radius:4px; display:block; margin:0 auto;"></iframe>
  </div>
</div>


<script src="../../../components/AIwidget.js"></script>
<script src="Segnapunti.js"></script>
</body>
</html>
