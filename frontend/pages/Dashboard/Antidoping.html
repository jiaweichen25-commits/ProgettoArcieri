<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Arcieri Vicenza – Antidoping</title>
  <link rel="stylesheet" href="Materiali.css" />
</head>
<body>

<nav>
  <div class="brand">
    <div class="brand-accent"></div>
    <div class="brand-text">
      <span>Antidoping</span>
      <strong id="titoloAtleta">—</strong>
    </div>
  </div>
  <div class="nav-right">
    <button class="btn-logout" onclick="tornaDashboard()">← Dashboard</button>
  </div>
</nav>

<div class="page">
  <div class="page-header">
    <div class="pill">Area Istruttore</div>
    <h1 id="titoloAtleta2">Antidoping</h1>
  </div>

  <div class="msg-box" id="pageMsgBox"></div>

  <div class="section">
    <div class="section-head">
      <div class="section-title">Elenco Antidoping</div>
      <button class="btn btn-red" onclick="openAddModal()">+ Nuovo Record</button>
    </div>

    <div id="antidopingList"></div>

    <div class="empty-state" id="emptyState">
      <p>Nessun record antidoping registrato. Aggiungi il primo!</p>
    </div>
  </div>
</div>


<!-- ══════════════════════════════════════════
     MODAL: Aggiungi / Modifica
══════════════════════════════════════════ -->
<div class="overlay" id="formModal">
  <div class="modal">
    <div class="modal-pill" id="formModalPill">Nuovo Record</div>
    <h2 id="formModalTitle">Aggiungi record</h2>
    <div class="modal-divider"></div>

    <div class="msg-box" id="formMsgBox"></div>

    <input type="hidden" id="editAntidopingId" />

    <div class="field">
      <label>Anno <span class="required">*</span></label>
      <input type="number" id="fAnno" placeholder="es. 2024" min="2000" max="2100" />
    </div>

    <div class="field">
      <label>Autorizzazione Fitarco</label>
      <div style="display:flex; align-items:center; gap:10px; margin-top:6px;">
        <input type="checkbox" id="fAutorizzazione" style="width:18px; height:18px;" />
        <span style="color:#ccc; font-size:0.9rem;">Autorizzazione concessa</span>
      </div>
    </div>

    <div class="field">
      <label>Scadenza Autorizzazione</label>
      <input type="date" id="fScadenza" />
    </div>

    <div class="modal-actions">
      <button class="btn btn-outline" onclick="closeModal('formModal')">Annulla</button>
      <button class="btn btn-red" onclick="salvaAntidoping()">Salva</button>
    </div>
  </div>
</div>


<!-- ══════════════════════════════════════════
     MODAL: Conferma Eliminazione
══════════════════════════════════════════ -->
<div class="overlay" id="deleteModal">
  <div class="modal modal-small">
    <div class="modal-pill">Attenzione</div>
    <h2>Elimina Record</h2>
    <div class="modal-divider"></div>
    <p id="deleteMsg">Sei sicuro di voler eliminare questo record?</p>
    <input type="hidden" id="deleteAntidopingId" />
    <div class="modal-actions">
      <button class="btn btn-outline" onclick="closeModal('deleteModal')">Annulla</button>
      <button class="btn btn-red" onclick="confermaElimina()">Elimina</button>
    </div>
  </div>
</div>


<script src="AIwidget.js"></script>
<script src="Antidoping.js"></script>
</body>
</html>
