<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" href="../../assets/Favicon.svg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arcieri - Accesso Istruttore</title>
    <link rel="stylesheet" href="Istruttore.css">
</head>
<body>

    <div class="top-bar"></div>

    <a href="../../index.html" class="back-link">← Home</a>

    <div class="card">
        <div class="tag">Area Istruttore</div>
        <h1>Accedi</h1>
        <div class="divider"></div>

        <div class="msg-box" id="msgBox"></div>

        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="field">
                <label>Username o Email</label>
                <input type="text" id="loginEmail" placeholder="admin@arcierivicenza.it o username" required />
            </div>
            <div class="field">
                <label>Password</label>
                <input type="password" id="loginPassword" placeholder="••••••••" required />
            </div>

            <div class="login-options">
                <label>
                    <input type="checkbox" id="rememberLogin" />
                    Ricordami
                </label>
                <a onclick="event.preventDefault(); openForgotPasswordModal();" style="cursor:pointer;">
                    Password dimenticata?
                </a>
            </div>

            <button type="submit" class="btn-primary" id="submitBtn">Accedi</button>
        </form>
    </div>

    <!-- Modale Recupero Password -->
    <div class="modal-overlay" id="forgotPasswordModal">
        <div class="modal-box">
            <h3>Recupero Password</h3>
            <p id="forgotModalDesc">Inserisci la tua email per ricevere un codice di verifica a 6 cifre.</p>
            
            <div class="msg-box" id="forgotMsgBox"></div>

            <!-- Step 1: Invia Email -->
            <div id="forgotStep1">
                <div class="field">
                    <label>Email registrata</label>
                    <input type="email" id="forgotEmail" placeholder="admin@arcierivicenza.it" />
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn-cancel" onclick="closeForgotPasswordModal()">Annulla</button>
                    <button type="button" class="btn-confirm" id="btnSendResetCode" onclick="handleSendResetCode()">Invia Codice</button>
                </div>
            </div>

            <!-- Step 2: Inserisci Codice e Nuova Password -->
            <div id="forgotStep2" style="display: none;">
                <div class="field">
                    <label>Codice di Verifica (6 cifre)</label>
                    <input type="text" id="resetCode" maxlength="6" placeholder="123456" />
                </div>
                <div class="field">
                    <label>Nuova Password <span style="color:#555; font-weight:400;">(min. 6 caratteri)</span></label>
                    <input type="password" id="resetNewPassword" placeholder="••••••••" />
                </div>
                <div class="field">
                    <label>Conferma Password</label>
                    <input type="password" id="resetConfirmPassword" placeholder="••••••••" />
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn-cancel" onclick="closeForgotPasswordModal()">Annulla</button>
                    <button type="button" class="btn-confirm" id="btnResetPassword" onclick="handleResetPassword()">Reimposta</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modale Cambio Password Primo Accesso -->
    <div class="modal-overlay" id="changePasswordModal">
        <div class="modal-box">
            <h3>Cambio Password Obbligatorio</h3>
            <p>Per motivi di sicurezza, devi cambiare la password al tuo primo accesso.</p>
            
            <div class="msg-box" id="changePwdMsgBox"></div>

            <div class="field">
                <label>Nuova Password <span style="color:#555; font-weight:400;">(min. 6 caratteri)</span></label>
                <input type="password" id="newPassword" placeholder="••••••••" required />
            </div>

            <div class="modal-actions">
                <button class="btn-confirm" id="changePwdBtn" onclick="handleChangePassword()">Salva Nuova Password</button>
            </div>
        </div>
    </div>



    <footer>
        <span>Arcieri Vicenza</span>
        <span>© 2026</span>
    </footer>

    <script src="Istruttore.js"></script>
</body>
</html>
