<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" href="../../assets/Favicon.svg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arcieri - Accesso Atleta</title>
    <link rel="stylesheet" href="Istruttore.css">
</head>
<body>

    <div class="top-bar"></div>

    <a href="../../index.html" class="back-link">← Home</a>

    <div class="card">
        <div class="tag">Area Atleta</div>
        <h1>Accedi</h1>
        <div class="divider"></div>

        <div class="msg-box" id="msgBox"></div>

        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="field">
                <label>Username o Email</label>
                <input type="email" id="loginEmail" placeholder="atleta@esempio.it o email" required />
            </div>
            <div class="field">
                <label>Password</label>
                <input type="password" id="loginPassword" placeholder="••••••••" required />
            </div>

            <div class="login-options">
                <label>
                    <input type="checkbox" id="rememberLogin" />
                    Ricordami
                </label>
                <a onclick="event.preventDefault(); showMsg('Contatta la segreteria per recuperare la password.', 'error');">
                    Password dimenticata?
                </a>
            </div>

            <button type="submit" class="btn-primary" id="submitBtn">Accedi</button>
            <!-- REGISTRAZIONE DISABILITATA - gestita dall'istruttore
            <p class="signup-link">
                Non hai un account?
                <a onclick="event.preventDefault(); openRegisterModal();">Registrati</a>
            </p>
            -->
        </form>
    </div>

    <!-- Modale Cambio Password Primo Accesso -->
    <div class="modal-overlay" id="changePasswordModal">
        <div class="modal-box">
            <h3>Cambio Password Obbligatorio</h3>
            <p>Per motivi di sicurezza, devi cambiare la password al tuo primo accesso.</p>
            
            <div class="msg-box" id="changePwdMsgBox"></div>

            <div class="field">
                <label>Nuova Password <span style="color:#555; font-weight:400;">(min. 6 caratteri)</span></label>
                <input type="password" id="newPassword" placeholder="••••••••" required />
            </div>

            <div class="modal-actions">
                <button class="btn-confirm" id="changePwdBtn" onclick="handleChangePassword()">Salva Nuova Password</button>
            </div>
        </div>
    </div>
    <footer>
        <span> Arcieri Vicenza</span>
        <span>© 2026</span>
    </footer>

    <script src="Atleti.js"></script>
</body>
</html>
