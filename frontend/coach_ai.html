<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coach AI Pro - Progetto Arcieri</title>
    <!-- Collegamento al file CSS Esterno -->
    <link rel="stylesheet" href="coach_ai.css">
</head>
<body>

<div class="main-container">
    <!-- BARRA LATERALE: SELEZIONE ATLETI -->
    <aside class="sidebar">
        <div class="sidebar-header">
            <h3>🏹 Lista Atleti</h3>
            <span class="athletes-count" id="athletesCount">0</span>
        </div>
        <div class="search-container">
            <input type="text" class="search-box" id="searchAtleti" placeholder="Cerca atleta...">
        </div>
        <div class="athletes-list" id="athletesList"></div>
    </aside>

    <!-- AREA PRINCIPALE OPERATIVA -->
    <main class="main-content">
        <div class="badge">Area Istruttore • AI Coach</div>
        <div class="header-zone">
            <div class="ai-icon">🤖</div>
            <div>
                <h1>Coach Virtuale AI</h1>
                <p class="subtitle">Analisi intelligente basata sui dati del DB</p>
            </div>
        </div>

        <!-- SCHEDE STATISTICHE DASHBOARD -->
        <div class="stats-row">
            <div class="stat-card"><div class="stat-label">Atleti Totali</div><div class="stat-value" id="statTotali">0</div></div>
            <div class="stat-card"><div class="stat-label">Conversazioni</div><div class="stat-value" id="statOggi">0</div></div>
            <div class="stat-card"><div class="stat-label">Selezionato</div><div class="stat-value" id="statSelezionato">—</div></div>
            <div class="stat-card"><div class="stat-label">Status AI</div><div class="stat-value" style="color: #4ade80;">● Online</div></div>
        </div>

        <!-- SEZIONE DINAMICA PROFILO E CHAT -->
        <div id="athleteSection">
            <div class="empty-state"><h3>Seleziona un atleta dalla lista per iniziare la consulenza tecnica.</h3></div>
        </div>
    </main>
</div>

<!-- Collegamento al modulo JavaScript Esterno -->
<script type="module" src="coach_ai.js"></script>
</body>
</html>
