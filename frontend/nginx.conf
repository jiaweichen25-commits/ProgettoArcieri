server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Il frontend chiama /api/...: nginx lo inoltra al backend nella rete Docker,
    # togliendo il prefisso /api (il backend vede /auth/login, non /api/auth/login).
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # SOVRASCRIVE l'header (non lo accoda): il backend si fida di X-Forwarded-For,
        # quindi un client non deve poter inventare il proprio IP.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;   # le risposte dell'assistente AI possono richiedere piu' di 60 secondi
    }
}
