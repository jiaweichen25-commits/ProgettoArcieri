<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard Arcieri</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }

    :root {
      --blue: #2c5282;
      --blue-light: #4a90e2;
      --green: #10b981;
      --amber: #f59e0b;
      --red: #ef4444;
      --bg: #f1f5f9;
      --card: #ffffff;
      --border: #e2e8f0;
      --text: #1a202c;
      --muted: #64748b;
    }

    body { background: var(--bg); color: var(--text); }

    /* HEADER */
    header {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 18px;
      align-items: center;
      margin: 24px auto 32px;
      max-width: 1200px;
      padding: 24px 28px;
      background: white;
      border-radius: 18px;
      box-shadow: 0 20px 60px rgba(15, 23, 42, 0.08);
      border: 1px solid rgba(148, 163, 184, 0.16);
    }
    header h1 { font-size: 1.8rem; color: var(--blue); }
    header p { font-size: 0.95rem; color: var(--muted); margin-top: 8px; }
    .header-info {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .header-actions { display: flex; align-items: center; justify-content: flex-end; }

    /* BUTTONS */
    .btn {
      padding: 10px 18px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      font-weight: 700;
      font-size: 0.9rem;
      transition: transform 0.2s, opacity 0.2s;
    }
    .btn:hover { opacity: 0.9; transform: translateY(-1px); }
    .btn-white { background: white; color: var(--blue); border: 1px solid rgba(44, 82, 130, 0.16); }
    .btn-red { background: var(--red); color: white; }
    .btn-blue { background: var(--blue); color: white; }
    .btn-sm {
      padding: 5px 10px;
      font-size: 0.78rem;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 600;
    }
    .btn-edit { background: var(--blue-light); color: white; }
    .btn-del  { background: var(--red); color: white; }

    /* MAIN */
    main { max-width: 1200px; margin: 30px auto; padding: 0 20px 40px; }

    /* STAT CARDS */
    .stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; margin-bottom: 32px; }
    .stat-card {
      background: var(--card);
      border-radius: 24px;
      padding: 32px 26px;
      text-align: center;
      border: 1px solid rgba(226, 232, 240, 0.9);
      box-shadow: 0 18px 55px rgba(15, 23, 42, 0.05);
    }
    .stat-icon {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      margin: 0 auto 16px;
      background: rgba(74, 144, 226, 0.12);
      font-size: 1.8rem;
    }
    .stat-num {
      font-size: 3.2rem;
      font-weight: 800;
      margin-bottom: 8px;
      color: var(--text);
    }
    .stat-lbl { font-size: 0.95rem; color: var(--muted); letter-spacing: 0.02em; }

    /* TABLE CARD */
    .card {
      background: var(--card);
      border-radius: 10px;
      border: 1px solid var(--border);
      margin-bottom: 28px;
      overflow: hidden;
    }
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px 24px;
      border-bottom: 1px solid var(--border);
      background: #f8fafc;
    }
    .card-title { font-size: 1.1rem; font-weight: 700; }

    table { width: 100%; border-collapse: collapse; }
    th {
      padding: 12px 20px;
      text-align: left;
      font-size: 0.8rem;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 600;
      background: #f8fafc;
      border-bottom: 1px solid var(--border);
    }
    td { padding: 14px 20px; border-bottom: 1px solid var(--border); font-size: 0.9rem; }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: #f8fafc; }

    .badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 600;
    }
    .badge-green { background: #d1fae5; color: #065f46; }
    .badge-amber { background: #fef3c7; color: #92400e; }

    .empty { text-align: center; padding: 40px; color: var(--muted); font-size: 0.9rem; }

    /* MODAL */
    .overlay {
      display: none;
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.45);
      z-index: 100;
      align-items: center;
      justify-content: center;
    }
    .overlay.open { display: flex; }
    .modal {
      background: white;
      border-radius: 12px;
      padding: 28px;
      width: 420px;
      max-width: 95vw;
    }
    .modal h2 { font-size: 1.15rem; margin-bottom: 20px; }
    .field { margin-bottom: 14px; }
    .field label { display: block; font-size: 0.83rem; font-weight: 600; color: var(--muted); margin-bottom: 5px; }
    .field input, .field select {
      width: 100%;
      padding: 9px 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.2s;
    }
    .field input:focus, .field select:focus { border-color: var(--blue-light); }
    .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; }

    @media (max-width: 640px) {
      .stats { grid-template-columns: 1fr; }
      header { flex-direction: column; gap: 12px; text-align: center; }
    }
  </style>
</head>
<body>

<header>
  <div class="header-info">
    <h1>📊 Dashboard Arcieri</h1>
    <p id="userDisplay">Accesso in corso...</p>
  </div>
  <div class="header-actions">
    <button class="btn btn-red" onclick="logout()">Esci</button>
  </div>
</header>

<main>

  <div class="stats">
    <div class="stat-card">
      <div class="stat-icon">👨‍🏫</div>
      <div class="stat-num" id="cntIstr">0</div>
      <div class="stat-lbl">Istruttori</div>
    </div>
    <div class="stat-card">
      <div class="stat-icon">🏹</div>
      <div class="stat-num" id="cntAtl">0</div>
      <div class="stat-lbl">Atleti</div>
    </div>
  </div>

  <div class="card">
    <div class="card-header">
      <span class="card-title">👨‍🏫 Istruttori</span>
      <button class="btn btn-blue" onclick="openModal('istr')">+ Aggiungi</button>
    </div>
    <table>
      <thead>
        <tr>
          <th>#</th><th>Nome</th><th>Email</th><th>Specialità</th><th>Stato</th><th>Azioni</th>
        </tr>
      </thead>
      <tbody id="istrBody"></tbody>
    </table>
  </div>

  <div class="card">
    <div class="card-header">
      <span class="card-title">🏹 Atleti</span>
      <button class="btn btn-blue" onclick="openModal('atl')">+ Aggiungi</button>
    </div>
    <table>
      <thead>
        <tr>
          <th>#</th><th>Nome</th><th>Cognome</th><th>Email</th><th>Città</th><th>Livello</th><th>Azioni</th>
        </tr>
      </thead>
      <tbody id="atlBody"></tbody>
    </table>
  </div>

</main>

<div class="overlay" id="modalIstr">
  <div class="modal">
    <h2 id="istrTitle">Aggiungi Istruttore</h2>
    <input type="hidden" id="istrIdx" value="-1" />
    <div class="field">
      <label>Nome</label>
      <input id="istrNome" placeholder="es. Mario Rossi" />
    </div>
    <div class="field">
      <label>Email</label>
      <input id="istrEmail" type="email" placeholder="es. mario@email.it" />
    </div>
    <div class="field">
      <label>Specialità</label>
      <input id="istrSpec" placeholder="es. Tiro con l'arco classico" />
    </div>
    <div class="field">
      <label>Stato</label>
      <select id="istrStato">
        <option>Attivo</option>
        <option>Inattivo</option>
      </select>
    </div>
    <div class="modal-actions">
      <button class="btn btn-white" style="border:1px solid var(--border)" onclick="closeModal('modalIstr')">Annulla</button>
      <button class="btn btn-blue" onclick="saveIstruttore()">Salva</button>
    </div>
  </div>
</div>

<div class="overlay" id="modalAtl">
  <div class="modal">
    <h2 id="atlTitle">Aggiungi Atleta</h2>
    <input type="hidden" id="atlIdx" value="-1" />
    <div class="field">
      <label>Nome</label>
      <input id="atlNome" placeholder="es. Luca" />
    </div>
    <div class="field">
      <label>Cognome</label>
      <input id="atlCognome" placeholder="es. Bianchi" />
    </div>
    <div class="field">
      <label>Email</label>
      <input id="atlEmail" type="email" placeholder="es. luca@email.it" />
    </div>
    <div class="field">
      <label>Città</label>
      <input id="atlCitta" placeholder="es. Milano" />
    </div>
    <div class="field">
      <label>Livello</label>
      <select id="atlLivello">
        <option>Principiante</option>
        <option>Intermedio</option>
        <option>Avanzato</option>
      </select>
    </div>
    <div class="modal-actions">
      <button class="btn btn-white" style="border:1px solid var(--border)" onclick="closeModal('modalAtl')">Annulla</button>
      <button class="btn btn-blue" onclick="saveAtleta()">Salva</button>
    </div>
  </div>
</div>

<script>
  const KEY_I = "arcieri_istruttori";
  const KEY_A = "arcieri_atleti";

  function load(key) {
    try { return JSON.parse(localStorage.getItem(key)) || []; } catch { return []; }
  }
  function save(key, data) { localStorage.setItem(key, JSON.stringify(data)); }

  function init() {
    const user = JSON.parse(localStorage.getItem("currentUser") || "null");
    // CORRETTO: Ora rimanda a Auth.html se la sessione non esiste
    if (!user) { window.location.href = "Auth.html"; return; } 
    document.getElementById("userDisplay").textContent = `Accesso come ${user.role} • ${user.email}`;
    render();
  }

  function render() {
    const istr = load(KEY_I);
    const atl  = load(KEY_A);

    document.getElementById("cntIstr").textContent = istr.length;
    document.getElementById("cntAtl").textContent  = atl.length;
    // NOTA: Rimossa la riga cntTot poiché l'elemento HTML non esiste nella pagina originale

    const iBody = document.getElementById("istrBody");
    iBody.innerHTML = istr.length === 0
      ? `<tr><td colspan="6"><div class="empty">📭 Nessun istruttore registrato</div></td></tr>`
      : istr.map((r, i) => `
          <tr>
            <td>#${i + 1}</td>
            <td>${r.nome || "-"}</td>
            <td>${r.email || "-"}</td>
            <td>${r.specialita || "-"}</td>
            <td><span class="badge badge-green">${r.stato || "Attivo"}</span></td>
            <td>
              <button class="btn-sm btn-edit" onclick="editIstr(${i})">Modifica</button>
              <button class="btn-sm btn-del"  onclick="delIstr(${i})">Elimina</button>
            </td>
          </tr>`).join("");

    const aBody = document.getElementById("atlBody");
    aBody.innerHTML = atl.length === 0
      ? `<tr><td colspan="7"><div class="empty">📭 Nessun atleta registrato</div></td></tr>`
      : atl.map((r, i) => `
          <tr>
            <td>#${i + 1}</td>
            <td>${r.nome || "-"}</td>
            <td>${r.cognome || "-"}</td>
            <td>${r.email || "-"}</td>
            <td>${r.citta || "-"}</td>
            <td><span class="badge badge-amber">${r.livello || "Principiante"}</span></td>
            <td>
              <button class="btn-sm btn-edit" onclick="editAtl(${i})">Modifica</button>
              <button class="btn-sm btn-del"  onclick="delAtl(${i})">Elimina</button>
            </td>
          </tr>`).join("");
  }

  // MODAL helpers
  function openModal(type) {
    if (type === "istr") {
      document.getElementById("istrTitle").textContent = "Aggiungi Istruttore";
      document.getElementById("istrIdx").value = -1;
      document.getElementById("istrNome").value = "";
      document.getElementById("istrEmail").value = "";
      document.getElementById("istrSpec").value = "";
      document.getElementById("istrStato").value = "Attivo";
      document.getElementById("modalIstr").classList.add("open");
    } else {
      document.getElementById("atlTitle").textContent = "Aggiungi Atleta";
      document.getElementById("atlIdx").value = -1;
      document.getElementById("atlNome").value = "";
      document.getElementById("atlCognome").value = "";
      document.getElementById("atlEmail").value = "";
      document.getElementById("atlCitta").value = "";
      document.getElementById("atlLivello").value = "Principiante";
      document.getElementById("modalAtl").classList.add("open");
    }
  }
  function closeModal(id) { document.getElementById(id).classList.remove("open"); }

  // ISTRUTTORI CRUD
  function editIstr(idx) {
    const r = load(KEY_I)[idx];
    document.getElementById("istrTitle").textContent = "Modifica Istruttore";
    document.getElementById("istrIdx").value = idx;
    document.getElementById("istrNome").value  = r.nome || "";
    document.getElementById("istrEmail").value = r.email || "";
    document.getElementById("istrSpec").value  = r.specialita || "";
    document.getElementById("istrStato").value = r.stato || "Attivo";
    document.getElementById("modalIstr").classList.add("open");
  }
  function saveIstruttore() {
    const nome = document.getElementById("istrNome").value.trim();
    const email = document.getElementById("istrEmail").value.trim();
    if (!nome || !email) { alert("Nome ed email obbligatori"); return; }
    const data = load(KEY_I);
    const idx  = parseInt(document.getElementById("istrIdx").value);
    const obj  = { nome, email, specialita: document.getElementById("istrSpec").value.trim(), stato: document.getElementById("istrStato").value };
    if (idx === -1) data.push(obj); else data[idx] = obj;
    save(KEY_I, data);
    closeModal("modalIstr");
    render();
  }
  function delIstr(idx) {
    if (!confirm("Eliminare questo istruttore?")) return;
    const data = load(KEY_I);
    data.splice(idx, 1);
    save(KEY_I, data);
    render();
  }

  // ATLETI CRUD
  function editAtl(idx) {
    const r = load(KEY_A)[idx];
    document.getElementById("atlTitle").textContent = "Modifica Atleta";
    document.getElementById("atlIdx").value = idx;
    document.getElementById("atlNome").value    = r.nome || "";
    document.getElementById("atlCognome").value = r.cognome || "";
    document.getElementById("atlEmail").value   = r.email || "";
    document.getElementById("atlCitta").value   = r.citta || "";
    document.getElementById("atlLivello").value = r.livello || "Principiante";
    document.getElementById("modalAtl").classList.add("open");
  }
  function saveAtleta() {
    const nome = document.getElementById("atlNome").value.trim();
    const cognome = document.getElementById("atlCognome").value.trim();
    const email = document.getElementById("atlEmail").value.trim();
    if (!nome || !email) { alert("Nome ed email obbligatori"); return; }
    const data = load(KEY_A);
    const idx  = parseInt(document.getElementById("atlIdx").value);
    const obj  = { nome, cognome, email, citta: document.getElementById("atlCitta").value.trim(), livello: document.getElementById("atlLivello").value };
    if (idx === -1) data.push(obj); else data[idx] = obj;
    save(KEY_A, data);
    closeModal("modalAtl");
    render();
  }
  function delAtl(idx) {
    if (!confirm("Eliminare questo atleta?")) return;
    const data = load(KEY_A);
    data.splice(idx, 1);
    save(KEY_A, data);
    render();
  }

  function logout() {
    // CORRETTO: Svuota i dati e reindirizza correttamente ad Auth.html
    localStorage.removeItem("currentUser");
    localStorage.removeItem("access_token");
    window.location.href = "Auth.html";
  }

  init();
</script>
</body>
</html>
