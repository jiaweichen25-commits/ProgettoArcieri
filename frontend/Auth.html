<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Arcieri - Login</title>
  <style>
    :root {
      --bg: #edf1f5;
      --surface: #ffffff;
      --surface-2: #f3f6f9;
      --line: #d9e0e8;
      --ink: #17202b;
      --muted: #65717f;
      --primary: #245b73;
      --primary-dark: #17384c;
      --danger: #b42318;
      --ok: #12715f;
      --shadow: 0 18px 45px rgba(23,32,43,0.1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: "Segoe UI", Roboto, Arial, sans-serif; }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #ffffff, #eef4f7);
      color: var(--ink);
    }

    button, input, select { font: inherit; }

    .login-box {
      background: var(--surface);
      padding: 40px 32px;
      border-radius: 12px;
      box-shadow: var(--shadow);
      width: 100%;
      max-width: 360px;
    }

    .login-brand {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 22px;
      color: var(--primary-dark);
      font-weight: 800;
      font-size: 1rem;
    }

    .login-brand-mark {
      width: 18px;
      height: 18px;
      border: 3px solid var(--primary);
      border-radius: 5px;
      transform: rotate(45deg);
    }

    h2 { margin: 0 0 24px; color: var(--primary-dark); font-size: 1.25rem; font-weight: 600; }

    .role-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 22px;
      background: var(--surface-2);
      padding: 4px;
      border: 1px solid var(--line);
      border-radius: 7px;
    }

    .role-tabs button {
      flex: 1;
      padding: 10px;
      border: none;
      background: transparent;
      cursor: pointer;
      font-weight: 600;
      border-radius: 5px;
      transition: 0.2s;
      color: var(--muted);
    }

    .role-tabs button.active { background: var(--primary); color: #fff; }

    .role-badge {
      display: inline-block;
      margin-bottom: 10px;
      font-size: 0.75rem;
      font-weight: 600;
      padding: 3px 9px;
      border-radius: 4px;
      background: #eef4f7;
      color: var(--primary-dark);
    }

    .field { margin-bottom: 15px; }

    .field label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      color: var(--muted);
      font-size: 0.82rem;
    }

    .field input, .field select {
      width: 100%;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 6px;
      font-size: 1rem;
      background: var(--surface);
      color: var(--ink);
    }

    .field input:focus, .field select:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(36,91,115,0.1);
    }

    .login-options {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 14px;
      margin: 18px 0 22px;
      color: var(--muted);
      font-size: 0.8rem;
    }

    .login-options label { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; }

    .login-options a {
      color: var(--primary-dark);
      text-decoration: underline;
      text-underline-offset: 2px;
      cursor: pointer;
    }

    .btn-primary {
      width: 100%;
      padding: 11px;
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 7px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, opacity 0.15s;
    }

    .btn-primary:hover:not(:disabled) { background: var(--primary-dark); }
    .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }

    .msg-box {
      display: none;
      margin-bottom: 14px;
      padding: 10px 12px;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 600;
    }

    .msg-box.error   { display: block; background: #fef2f2; border: 1px solid #fecaca; color: var(--danger); }
    .msg-box.success { display: block; background: #f0fdf4; border: 1px solid #86efac; color: var(--ok); }

    .signup-link { margin-top: 18px; color: var(--muted); font-size: 0.8rem; text-align: center; }
    .signup-link a { color: var(--primary-dark); text-decoration: underline; cursor: pointer; }

    /* Modale registrazione */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(20,28,38,0.5);
      z-index: 10;
      justify-content: center;
      align-items: center;
    }
    .modal-overlay.open { display: flex; }

    .modal-box {
      background: var(--surface);
      padding: 32px 28px;
      border-radius: 12px;
      box-shadow: var(--shadow);
      width: 100%;
      max-width: 340px;
    }

    .modal-box h3 { margin: 0 0 20px; color: var(--primary-dark); font-size: 1.1rem; }

    .modal-actions { display: flex; gap: 10px; margin-top: 20px; }
    .modal-actions button { flex: 1; padding: 10px; border-radius: 7px; font-weight: 600; cursor: pointer; border: 1px solid var(--line); }
    .modal-actions .btn-confirm { background: var(--primary); color: #fff; border-color: var(--primary); }
    .modal-actions .btn-cancel  { background: var(--surface); color: var(--ink); }
  </style>
</head>
<body>

  <!-- Form di login -->
  <div class="login-box">
    <div class="login-brand">
      <span class="login-brand-mark"></span>
      <span>Arcieri</span>
    </div>

    <h2>Sign in to your account</h2>

    <div class="role-tabs">
      <button class="active" id="tabUtente"    onclick="switchRole('atleta')">Utente</button>
      <button               id="tabIstruttore" onclick="switchRole('istruttore')">Istruttore</button>
    </div>

    <span class="role-badge" id="roleLabel">Accesso Atleta</span>

    <div class="msg-box" id="msgBox"></div>

    <form id="loginForm" onsubmit="handleLogin(event)">
      <div class="field">
        <label>Email</label>
        <input type="email" id="loginEmail" placeholder="email@example.com" required />
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" id="loginPassword" placeholder="••••••••" required />
      </div>

      <div class="login-options">
        <label><input type="checkbox" id="rememberLogin" /> Remember me</label>
        <a onclick="event.preventDefault(); showMsg('Contatta la segreteria per recuperare la password.', 'error');">
          Forgot password?
        </a>
      </div>

      <button type="submit" class="btn-primary" id="submitBtn">Accedi</button>

      <p class="signup-link">
        Don't have an account?
        <a onclick="event.preventDefault(); openRegisterModal();">Sign up</a>
      </p>
    </form>
  </div>

  <!-- Modale registrazione -->
  <div class="modal-overlay" id="registerModal">
    <div class="modal-box">
      <h3>Crea un account</h3>

      <div class="msg-box" id="modalMsgBox"></div>

      <div class="field">
        <label>Email</label>
        <input type="email" id="regEmail" placeholder="email@example.com" />
      </div>
      <div class="field">
        <label>Password <span style="color:var(--muted); font-weight:400;">(min. 6 caratteri)</span></label>
        <input type="password" id="regPassword" placeholder="••••••••" />
      </div>
      <div class="field">
        <label>Ruolo</label>
        <select id="regRuolo">
          <option value="atleta">Atleta</option>
          <option value="istruttore">Istruttore</option>
        </select>
      </div>

      <div class="modal-actions">
        <button class="btn-cancel"  onclick="closeRegisterModal()">Annulla</button>
        <button class="btn-confirm" id="regBtn" onclick="handleRegister()">Registrati</button>
      </div>
    </div>
  </div>

  <script>
    // ── CONFIGURAZIONE ───────────────────────────────────────────────────────
    // Usa URL relative per passare attraverso Nginx proxy
    const API_URL = "";
    // ────────────────────────────────────────────────────────────────────────

    let currentRole = "atleta";

    // Mostra messaggio nel form principale
    function showMsg(testo, tipo) {
      const box = document.getElementById("msgBox");
      box.textContent = testo;
      box.className   = "msg-box " + tipo;
    }

    // Mostra messaggio nella modale
    function showModalMsg(testo, tipo) {
      const box = document.getElementById("modalMsgBox");
      box.textContent = testo;
      box.className   = "msg-box " + tipo;
    }

    function switchRole(role) {
      currentRole = role;
      document.getElementById("tabUtente").classList.toggle("active", role === "atleta");
      document.getElementById("tabIstruttore").classList.toggle("active", role === "istruttore");
      document.getElementById("roleLabel").textContent =
        role === "atleta" ? "Accesso Atleta" : "Accesso Istruttore";
      document.getElementById("msgBox").className = "msg-box";
    }

    // Legge il ruolo dal payload JWT
    function getRuoloDalToken(token) {
      try {
        return JSON.parse(atob(token.split(".")[1].replace(/-/g,"+").replace(/_/g,"/"))).ruolo;
      } catch { return null; }
    }

    function redirectByRuolo(token) {
      const ruolo = getRuoloDalToken(token);
      if (ruolo === "istruttore") window.location.href = "index.html";
      else                        window.location.href = "dashboard.html";
    }

    // ── LOGIN ────────────────────────────────────────────────────────────────
    async function handleLogin(e) {
      e.preventDefault();
      document.getElementById("msgBox").className = "msg-box";

      const email    = document.getElementById("loginEmail").value.trim();
      const password = document.getElementById("loginPassword").value;
      const btn      = document.getElementById("submitBtn");

      btn.disabled    = true;
      btn.textContent = "Accesso in corso...";

      try {
        const res = await fetch(`${API_URL}/auth/login`, {
          method:  "POST",
          headers: { "Content-Type": "application/json" },
          body:    JSON.stringify({ email, password })
        });

        if (!res.ok) {
          const err = await res.json().catch(() => ({}));
          showMsg(err.detail || "Credenziali non valide.", "error");
          return;
        }

        const data = await res.json();
        localStorage.setItem("access_token", data.access_token);

        if (document.getElementById("rememberLogin").checked) {
          localStorage.setItem("remember_email", email);
        } else {
          localStorage.removeItem("remember_email");
        }

        redirectByRuolo(data.access_token);

      } catch {
        showMsg("Impossibile contattare il server. Verifica che il backend sia avviato.", "error");
      } finally {
        btn.disabled    = false;
        btn.textContent = "Accedi";
      }
    }

    // ── REGISTRAZIONE ────────────────────────────────────────────────────────
    function openRegisterModal() {
      document.getElementById("regEmail").value    = "";
      document.getElementById("regPassword").value = "";
      document.getElementById("regRuolo").value    = currentRole;
      document.getElementById("modalMsgBox").className = "msg-box";
      document.getElementById("registerModal").classList.add("open");
    }

    function closeRegisterModal() {
      document.getElementById("registerModal").classList.remove("open");
    }

    async function handleRegister() {
      const email    = document.getElementById("regEmail").value.trim();
      const password = document.getElementById("regPassword").value;
      const ruolo    = document.getElementById("regRuolo").value;
      const btn      = document.getElementById("regBtn");

      if (!email || !password) {
        showModalMsg("Compila tutti i campi.", "error");
        return;
      }
      if (password.length < 6) {
        showModalMsg("La password deve avere almeno 6 caratteri.", "error");
        return;
      }

      btn.disabled    = true;
      btn.textContent = "Registrazione...";

        try {
    const res = await fetch(`${API_URL}/auth/register`, {
      method:  "POST",
      headers: { "Content-Type": "application/json" },
      body:    JSON.stringify({ email, password, ruolo })
    });

    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      showModalMsg(err.detail || "Errore durante la registrazione.", "error");
      return;
    }

    // Registrazione ok → ora fai login automatico per ottenere il token
    const loginRes = await fetch(`${API_URL}/auth/login`, {
      method:  "POST",
      headers: { "Content-Type": "application/json" },
      body:    JSON.stringify({ email, password })
    });

    const loginData = await loginRes.json();
    localStorage.setItem("access_token", loginData.access_token);

    closeRegisterModal();
    redirectByRuolo(loginData.access_token);

  } catch {
    showModalMsg("Impossibile contattare il server.", "error");
  } finally {
    btn.disabled    = false;
    btn.textContent = "Registrati";
  }
}

    // ── Al caricamento: ripristina email e controlla token esistente ─────────
    window.addEventListener("DOMContentLoaded", () => {
      const saved = localStorage.getItem("remember_email");
      if (saved) {
        document.getElementById("loginEmail").value = saved;
        document.getElementById("rememberLogin").checked = true;
      }
      const token = localStorage.getItem("access_token");
      if (token) redirectByRuolo(token);
    });
  </script>

</body>
</html>
